name: Agent Tool - Publish Native Package Signing Toolchain

on:
  workflow_dispatch:
    inputs:
      confirm_control_sha:
        description: Exact protected main commit to build
        required: true
        type: string

permissions: {}

concurrency:
  group: native-package-signing-toolchain
  cancel-in-progress: false

jobs:
  publish:
    name: Build and attest fixed signing toolchain
    if: >-
      github.repository == 'WuKongIM/packages' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: native-package-toolchain-publish
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out exact protected control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate exact build authorization
        shell: bash
        env:
          CONFIRM_CONTROL_SHA: ${{ inputs.confirm_control_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRM_CONTROL_SHA" = "$GITHUB_SHA"
          ./tests/contract.sh
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build fixed linux-amd64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/wukongim/native-package-signing-toolchain:control-$GITHUB_SHA"
          docker build \
            --platform linux/amd64 \
            --file toolchain/native-package-signing/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" \
            .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            "$image" bash -euo pipefail -c \
            'test "$(id -u)" = 65532; command -v gpg rpm rpmsign createrepo_c dpkg-scanpackages apt-ftparchive python3 zstd >/dev/null'

      - name: Push image and bind immutable digest
        id: push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/WuKongIM/packages.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          image="ghcr.io/wukongim/native-package-signing-toolchain:control-$GITHUB_SHA"
          push_log="$RUNNER_TEMP/native-package-toolchain-push.log"
          docker push "$image" 2>&1 | tee "$push_log"
          mapfile -t pushed_digests < <(
            awk -v tag="control-$GITHUB_SHA:" \
              'NF == 5 && $1 == tag && $2 == "digest:" && $3 ~ /^sha256:[0-9a-f]{64}$/ &&
               $4 == "size:" && $5 ~ /^[1-9][0-9]*$/ {print $3}' \
              "$push_log"
          )
          test "${#pushed_digests[@]}" -eq 1
          digest="${pushed_digests[0]}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/amd64 "ghcr.io/wukongim/native-package-signing-toolchain@$digest"
          test "$(docker image inspect "ghcr.io/wukongim/native-package-signing-toolchain@$digest" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(git ls-remote https://github.com/WuKongIM/packages.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Re-fence control immediately before provenance write
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/WuKongIM/packages.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Generate registry build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/wukongim/native-package-signing-toolchain
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Re-fence control after provenance write
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/WuKongIM/packages.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Record public toolchain receipt
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/wukongim/native-package-signing-toolchain@$IMAGE_DIGEST"
          mkdir -p "$RUNNER_TEMP/native-package-toolchain-receipt"
          docker run --rm --network none --read-only "$image" \
            dpkg-query -W '-f=${Package}\t${Version}\n' \
            | LC_ALL=C sort \
            >"$RUNNER_TEMP/native-package-toolchain-receipt/packages.tsv"
          jq -n \
            --arg schema 'wukongim/native-package-signing-toolchain-receipt/v1' \
            --arg control_sha "$GITHUB_SHA" \
            --arg image 'ghcr.io/wukongim/native-package-signing-toolchain' \
            --arg digest "$IMAGE_DIGEST" \
            '{schema:$schema,control_sha:$control_sha,image:$image,digest:$digest,platform:"linux/amd64"}' \
            >"$RUNNER_TEMP/native-package-toolchain-receipt/receipt.json"

      - name: Upload public toolchain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-signing-toolchain-${{ github.sha }}
          path: ${{ runner.temp }}/native-package-toolchain-receipt/
          if-no-files-found: error
          retention-days: 90

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

      - name: Reject tracked-tree mutation
        if: always()
        run: git diff --exit-code HEAD --
